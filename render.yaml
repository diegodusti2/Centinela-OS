services:
  - type: web
    name: centinela-os
    runtime: node
    branch: main
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_DASHBOARD_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DEMO_PAYMENTS
        value: "false"
      - key: ALLOW_LEGACY_BASIC
        value: "false"
