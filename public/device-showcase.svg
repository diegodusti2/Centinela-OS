<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="showcase-title showcase-desc">
  <title id="showcase-title">Centinela OS en teléfonos Android</title>
  <desc id="showcase-desc">Composición vectorial de teléfonos Samsung, Honor y Redmi con el panel de protección de Centinela OS.</desc>
  <defs>
    <linearGradient id="halo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#eff6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1e3a8a" flood-opacity=".18"/>
    </filter>
  </defs>

  <circle cx="380" cy="278" r="260" fill="url(#halo)"/>
  <circle cx="590" cy="94" r="76" fill="#dbeafe" opacity=".65"/>
  <circle cx="92" cy="440" r="54" fill="#e0f2fe" opacity=".8"/>

  <!-- Dispositivo lateral izquierdo -->
  <g transform="rotate(-9 150 300)" filter="url(#shadow)">
    <rect x="70" y="90" width="168" height="366" rx="30" fill="#0f172a"/>
    <rect x="78" y="98" width="152" height="350" rx="24" fill="url(#screen)"/>
    <rect x="133" y="108" width="42" height="6" rx="3" fill="#334155"/>
    <circle cx="96" cy="126" r="4" fill="#60a5fa"/>
    <path d="M99 250 C128 220 165 222 207 252" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" opacity=".7"/>
    <path d="M98 288 C130 260 169 267 211 294" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity=".55"/>
    <rect x="98" y="342" width="110" height="8" rx="4" fill="#334155"/>
    <rect x="98" y="362" width="76" height="8" rx="4" fill="#1d4ed8"/>
  </g>
  <g transform="translate(74 460)">
    <rect width="116" height="30" rx="15" fill="#fff" stroke="#bfdbfe"/>
    <text x="58" y="20" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">SAMSUNG</text>
  </g>

  <!-- Dispositivo central -->
  <g filter="url(#shadow)">
    <rect x="238" y="34" width="246" height="492" rx="42" fill="#020617"/>
    <rect x="248" y="44" width="226" height="472" rx="34" fill="url(#screen)"/>
    <rect x="333" y="54" width="56" height="8" rx="4" fill="#334155"/>
    <rect x="266" y="94" width="190" height="78" rx="20" fill="#1e40af" opacity=".78"/>
    <path d="M288 134 C316 106 350 106 380 133 C405 155 425 151 444 126" fill="none" stroke="#93c5fd" stroke-width="4" opacity=".85"/>
    <circle cx="287" cy="118" r="5" fill="#22c55e"/>
    <text x="302" y="123" fill="#dbeafe" font-family="Arial, sans-serif" font-size="12" font-weight="700">ESCUDO EN LINEA</text>
    <rect x="266" y="194" width="190" height="112" rx="20" fill="#fff" opacity=".96"/>
    <circle cx="301" cy="232" r="19" fill="#dbeafe"/>
    <path d="M301 220 L311 225 L309 239 L301 247 L293 239 L291 225 Z" fill="#2563eb"/>
    <rect x="332" y="220" width="90" height="9" rx="4.5" fill="#0f172a"/>
    <rect x="332" y="240" width="65" height="7" rx="3.5" fill="#94a3b8"/>
    <rect x="286" y="270" width="138" height="8" rx="4" fill="#dbeafe"/>
    <rect x="266" y="330" width="88" height="70" rx="18" fill="#172554" stroke="#2563eb"/>
    <rect x="368" y="330" width="88" height="70" rx="18" fill="#172554" stroke="#38bdf8"/>
    <text x="310" y="370" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="11" font-weight="700">GPS</text>
    <text x="412" y="370" text-anchor="middle" fill="#bae6fd" font-family="Arial, sans-serif" font-size="11" font-weight="700">ALERTAS</text>
    <rect x="282" y="432" width="160" height="13" rx="6.5" fill="url(#accent)"/>
  </g>
  <g transform="translate(303 516)">
    <rect width="116" height="30" rx="15" fill="#2563eb"/>
    <text x="58" y="20" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">CENTINELA</text>
  </g>

  <!-- Dispositivo lateral derecho -->
  <g transform="rotate(10 570 300)" filter="url(#shadow)">
    <rect x="486" y="104" width="168" height="366" rx="30" fill="#0f172a"/>
    <rect x="494" y="112" width="152" height="350" rx="24" fill="#f8fafc"/>
    <rect x="549" y="122" width="42" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="514" y="168" width="112" height="74" rx="16" fill="#dbeafe"/>
    <circle cx="542" cy="205" r="17" fill="#2563eb"/>
    <path d="M542 193 L551 198 L549 211 L542 218 L535 211 L533 198 Z" fill="#fff"/>
    <rect x="514" y="266" width="112" height="13" rx="6.5" fill="#bfdbfe"/>
    <rect x="514" y="292" width="82" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="514" y="328" width="112" height="10" rx="5" fill="#93c5fd"/>
    <rect x="514" y="352" width="92" height="10" rx="5" fill="#e2e8f0"/>
  </g>
  <g transform="translate(532 474)">
    <rect width="92" height="30" rx="15" fill="#fff" stroke="#bfdbfe"/>
    <text x="46" y="20" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">HONOR</text>
  </g>
  <text x="607" y="84" fill="#2563eb" font-family="Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="2">REDMI</text>
</svg>
