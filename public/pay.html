<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Centinela OS | Solicitar licencia</title>
  <link rel="stylesheet" href="/pay.css">
</head>
<body>
  <main class="card">
    <p class="eyebrow">CENTINELA OS / ACTIVACION</p>
    <h1>Proteccion con consentimiento</h1>
    <p class="intro">Solicita una licencia sin introducir datos de tarjeta. El pago se completa únicamente en el proveedor autorizado y el administrador valida la solicitud.</p>
    <form id="registration-form">
      <label>Nombre completo<input name="name" autocomplete="name" required maxlength="120"></label>
      <label>Correo electrónico<input name="email" type="email" autocomplete="email" required maxlength="254"></label>
      <label>ID del dispositivo<input name="deviceId" required maxlength="160" placeholder="ID mostrado por la app"></label>
      <label>Plan<select name="plan"><option value="1">1 mes · USD 3</option><option value="6">6 meses · USD 15</option><option value="12">12 meses · USD 24</option></select></label>
      <label class="consent"><input name="consent" type="checkbox" required> Confirmo que soy propietario o tengo autorización para proteger este dispositivo.</label>
      <button type="submit">Enviar solicitud</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <p class="note">No envíes números de tarjeta, CVV ni contraseñas a este formulario.</p>
  </main>
  <script src="/pay.js" defer></script>
</body>
</html>
